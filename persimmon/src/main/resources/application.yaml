# ============================================================================
#  persimmon 后端配置
# ============================================================================

server:
  # 和前端 vite.config.js 里代理的目标端口一致，改了要两边一起改
  port: 8080

spring:
  application:
    name: persimmon

  # --------------------------------------------------------------------------
  # 数据库连接
  # --------------------------------------------------------------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/persimmon?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root

    password: 123456

    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  # --------------------------------------------------------------------------
  # 上传文件大小限制
  # --------------------------------------------------------------------------
  # 和 Python 服务的 MAX_UPLOAD_MB=20、前端提示保持一致
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      # 文件先写临时目录再处理，别全憋在内存里
      file-size-threshold: 2MB

# ============================================================================
#  图片存储
# ============================================================================
#  mode: oss     → 传阿里云 OSS（默认）
#  mode: local   → 存本机磁盘，离线演示兜底（改这一个词就能切，代码不用动）
#
#  ⚠️⚠️ AccessKey 千万不要提交到公开仓库！
#      泄露 = 别人用你的账号上传/刷流量，账单算你的。
#      推荐：set 环境变量，别写在这文件里
#        set OSS_AK=你的AccessKeyId
#        set OSS_SK=你的AccessKeySecret
#      下面 ${OSS_AK:} 的意思是"读环境变量 OSS_AK，没有就留空"。
# ============================================================================
storage:
  mode: oss

  oss:
    endpoint: oss-cn-beijing.aliyuncs.com      # 你的 bucket 在哪个地域就改哪个
    access-key-id: ${OSS_AK:}
    access-key-secret: ${OSS_SK:}
    bucket: your-bucket-name                   # ← 改成你的 bucket 名
    dir: taihang/captures/                     # 对象名前缀，带项目名免得和别人混
    url-prefix:                                # 可选：绑了自定义域名/CDN 才填

  local:
    dir: D:/vegetable_fruit_yolo/data/images
    url-prefix: /files/


# ============================================================================
#  MyBatis 配置
# ============================================================================
mybatis:
  configuration:
    map-underscore-to-camel-case: true

  mapper-locations: classpath:mapper/*.xml

# ============================================================================
#  AI 服务（Python）
# ============================================================================
ai:
  service:
    base-url: http://127.0.0.1:8001
    predict-path: /api/predict
    health-path: /api/health

    # 连接超时：连不上就赶紧失败
    connect-timeout-ms: 3000

    # 读取超时：给足。模型冷启动要十几秒，给短了会出现
    # "推理其实成功了，Java 却报超时"的诡异现象
    read-timeout-ms: 60000

# ============================================================================
#  日志
# ============================================================================
logging:
  level:
    root: info
    # 只看我们自己的包，把 SQL 也打出来（开发期很有用）
    org.ymg.persimmon: debug
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"
